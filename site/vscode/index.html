<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>VS Code Redirect</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main>
    <h1>VS Code Redirect</h1>

    <section id="redirecting" hidden>
      <p>Opening in VS Code&hellip;</p>
      <p><a id="manual-link" href="#">Open manually</a></p>
    </section>

    <section id="converter" hidden>
      <p>Paste a local path. Links open in a new VS Code window.</p>
      <label for="source">Local path</label>
      <input id="source" type="text" placeholder="/Users/..." autocomplete="off" spellcheck="false">
      <p id="hint" class="hint" hidden>Enter an absolute path starting with <code>/</code>.</p>

      <div id="results" hidden>
        <div class="result">
          <span class="result-label">File</span>
          <span class="result-name" id="file-name"></span>
          <button type="button" data-copy="file">Copy link</button>
          <a class="button" id="file-open" href="#">Open</a>
        </div>
        <div class="result">
          <span class="result-label">Folder</span>
          <span class="result-name" id="folder-name"></span>
          <button type="button" data-copy="folder">Copy link</button>
          <a class="button" id="folder-open" href="#">Open</a>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { toVscodeUri, normalizePath, parentFolder, baseName, toRedirectLink } from "./redirect.js";

    const target = toVscodeUri(location.hash);

    if (target) {
      document.getElementById("manual-link").href = target;
      document.getElementById("redirecting").hidden = false;
      location.replace(target);
    } else {
      const source = document.getElementById("source");
      const hint = document.getElementById("hint");
      const results = document.getElementById("results");
      const links = {};
      document.getElementById("converter").hidden = false;

      source.addEventListener("input", () => {
        const path = normalizePath(source.value);
        const valid = path.startsWith("/");
        hint.hidden = !path || valid;
        results.hidden = !valid;
        if (!valid) return;

        const folder = parentFolder(path);
        links.file = toRedirectLink(path, location.href, { newWindow: true });
        links.folder = toRedirectLink(folder, location.href, { newWindow: true });
        document.getElementById("file-name").textContent = baseName(path);
        document.getElementById("folder-name").textContent = baseName(folder);
        document.getElementById("file-open").href = toVscodeUri(new URL(links.file).hash);
        document.getElementById("folder-open").href = toVscodeUri(new URL(links.folder).hash);
      });

      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", async () => {
          await navigator.clipboard.writeText(links[button.dataset.copy]);
          button.textContent = "Copied";
          setTimeout(() => { button.textContent = "Copy link"; }, 1500);
        });
      });
    }
  </script>
</body>
</html>
